<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN Engine</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #1A1A2E; }
        #composeApp { width: 100%; height: 100%; }
        #status {
            position: fixed; left: 0; top: 0; right: 0; max-height: 50%;
            overflow: auto; z-index: 9999; display: none;
            font: 12px/1.5 monospace; color: #ffd; background: rgba(0,0,0,0.85);
            padding: 8px 12px; white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="composeApp"></div>
    <pre id="status"></pre>
    <script>
        const statusEl = document.getElementById('status');
        function show(msg) { statusEl.style.display = 'block'; statusEl.textContent += msg + '\n'; }
        window.addEventListener('error', e => show('ERROR: ' + (e.message || e.error)));
        window.addEventListener('unhandledrejection', e => show('PROMISE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
    </script>
    <script src="composeApp.js"></script>
</body>
</html>
